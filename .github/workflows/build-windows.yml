name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'installer/**'
      - 'launcher.py'
      - 'pyproject.toml'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: arara-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pytest

      - name: Validate app, publishing modules and versions
        shell: pwsh
        run: |
          python -m compileall -q src launcher.py
          python -c "import PySide6.QtMultimedia; import PySide6.QtMultimediaWidgets; import arara_factory.app; import arara_factory.batch; import arara_factory.batch_worker; import arara_factory.entry; import arara_factory.integrated_batch; import arara_factory.oauth_local; import arara_factory.preview; import arara_factory.process_utils; import arara_factory.publishing; import arara_factory.publishing_library; import arara_factory.publishing_library_ui; import arara_factory.publishing_ui; import arara_factory.publishing_oauth_ui; import arara_factory.publishing_runtime_ui; import arara_factory.secure_store; import arara_factory.smart_ui; import arara_factory.social_oauth; import arara_factory.updater; import googleapiclient.discovery; import googleapiclient.http; import google_auth_oauthlib.flow; import google.oauth2.credentials; print('ARARA guided UI imports OK')"
          @'
          import re
          import tomllib
          from pathlib import Path
          from arara_factory.process_utils import hidden_process_kwargs
          from arara_factory.secure_store import credentials_path, load_credentials, save_credentials
          from arara_factory.version import __version__

          package = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          installer_text = Path('installer/arara_factory.iss').read_text(encoding='utf-8')
          match = re.search(r'#define MyAppVersion "([^"]+)"', installer_text)
          assert match, 'Installer version is missing'
          installer = match.group(1)
          assert package == __version__ == installer, (package, __version__, installer)

          hidden = hidden_process_kwargs()
          assert hidden.get('creationflags', 0), hidden
          assert hidden.get('startupinfo') is not None, hidden

          project = tomllib.load(open('pyproject.toml', 'rb'))['project']['scripts']
          assert set(project.values()) == {'arara_factory.entry:main'}, project

          secret_file = credentials_path()
          previous = secret_file.read_bytes() if secret_file.exists() else None
          try:
              save_credentials({'youtube': {'token': {'refresh_token': 'test-secret'}}})
              assert secret_file.read_bytes().startswith(b'DPAPI\0')
              restored = load_credentials()
              assert restored['youtube']['token']['refresh_token'] == 'test-secret'
          finally:
              if previous is None:
                  secret_file.unlink(missing_ok=True)
              else:
                  secret_file.write_bytes(previous)

          print(f'Versions synchronized: {package}; one entry; DPAPI and publishing modules OK')
          '@ | python -
          pytest -q

      - name: Smoke-test guided smart UI
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          @'
          from PySide6.QtWidgets import QApplication
          from arara_factory.smart_ui import SmartMainWindow

          app = QApplication([])
          window = SmartMainWindow()

          assert window.mode_tabs.count() == 2
          assert window.mode_tabs.tabText(0) == 'Создать Reels'
          assert window.mode_tabs.tabText(1).startswith('Опубликовать')

          assert window.create_stack.count() == 4
          assert window.publish_stack.count() == 4
          assert len(window.create_step_buttons) == 4
          assert len(window.publish_step_buttons) == 4
          assert window.create_stack.currentIndex() == 0
          assert window.publish_stack.currentIndex() == 0

          assert window.reel_card.choose_button.text() == 'Выбрать видео'
          assert window.brainrot_card.choose_button.text() == 'Выбрать видео'
          assert window.choose_reels_button.text() == 'Выбрать файлы'
          assert window.choose_folder_button.text() == 'Выбрать папку'
          assert window.schedule_selected_button.text() == 'Добавить в очередь'
          assert window.preview_button.text() == 'Превью 5 сек'

          assert window.delay_minutes.maximum() >= 10080
          assert window.interval.count() >= 3
          assert window.progress.parentWidget().objectName() == 'activityBar'
          assert window.render_button.minimumWidth() >= 230
          assert window.render_button.maximumWidth() <= 340
          assert window.schedule_selected_button.minimumWidth() >= 200
          assert window.publish_summary.wordWrap() is True

          # Future steps are intentionally locked until prior inputs are valid.
          assert not window.create_step_buttons[1].isEnabled()
          assert not window.publish_step_buttons[1].isEnabled()

          window.deleteLater()
          app.processEvents()
          print('ARARA guided smart UI smoke test OK')
          '@ | python -

      - name: Download FFmpeg
        shell: powershell
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $probe = Get-ChildItem ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $bin -or -not $probe) { throw 'FFmpeg download is incomplete' }
          Copy-Item $bin.FullName ffmpeg.exe
          Copy-Item $probe.FullName ffprobe.exe

      - name: Smoke-test transactional FFmpeg render and frame zero
        shell: powershell
        run: |
          .\ffmpeg.exe -y -hide_banner -loglevel error -f lavfi -i "color=c=blue:s=270x480:r=30" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 9 -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac smoke-reel.mp4
          .\ffmpeg.exe -y -hide_banner -loglevel error -f lavfi -i "color=c=red:s=320x180:r=30" -t 20 -c:v libx264 -preset ultrafast -pix_fmt yuv420p smoke-brainrot.mp4
          @'
          import subprocess
          from pathlib import Path
          from PIL import Image
          from arara_factory.geometry import canonical_layout
          from arara_factory.publishing import Platform, PublishQueue
          from arara_factory.render import RenderOptions, _binary, probe_media, render_reels

          progress_values = []
          output = Path('smoke-output')
          made = render_reels(
              Path('smoke-reel.mp4'),
              Path('smoke-brainrot.mp4'),
              output,
              RenderOptions(
                  subtitles_enabled=True,
                  subtitle_mode='arara',
                  encoder_mode='cpu',
                  encoder_preset='ultrafast',
                  crf=28,
              ),
              progress=lambda value, text: progress_values.append((value, text)),
              log=print,
          )
          assert len(made) == 1 and made[0].is_file(), made
          assert progress_values and progress_values[-1][0] == 100, progress_values[-5:]
          assert any(20 <= value <= 95 for value, _ in progress_values), progress_values
          assert not list(output.glob('*.part.mp4')), list(output.glob('*'))

          queue = PublishQueue(Path('smoke-publishing-queue.json'))
          jobs = queue.enqueue(
              made,
              [Platform.TIKTOK, Platform.INSTAGRAM, Platform.YOUTUBE],
              'ARARA {n} {filename}',
              15,
              start_at=1000,
          )
          assert len(jobs) == 1
          queue.update_delivery(jobs[0], Platform.YOUTUBE, status='success', remote_id='test')
          queue.update_delivery(jobs[0], Platform.TIKTOK, status='failed', error='test')
          restored = PublishQueue(Path('smoke-publishing-queue.json')).jobs[0]
          assert Platform.YOUTUBE not in restored.pending_platforms
          assert Platform.TIKTOK in restored.pending_platforms

          ffprobe = _binary('ffprobe')
          ffmpeg = _binary('ffmpeg')
          assert ffprobe and ffmpeg
          info = probe_media(ffprobe, made[0])
          assert 8.85 <= info.duration <= 9.15, info.duration

          first = Path('first-frame.png')
          subprocess.run(
              [ffmpeg, '-y', '-hide_banner', '-loglevel', 'error', '-i', str(made[0]), '-frames:v', '1', str(first)],
              check=True,
          )
          image = Image.open(first).convert('RGB')
          _, brain = canonical_layout(info.width, info.height)
          pixel = image.getpixel((brain.x + brain.width // 2, brain.y + brain.height // 2))
          assert pixel[0] > 120 and pixel[0] > pixel[2] + 60, (
              'Brainrot is missing on output frame zero', pixel
          )
          print(f'ARARA smoke render and queue OK: {made[0]} ({info.duration:.3f}s)')
          '@ | python -

      - name: Build installed application directory
        shell: powershell
        run: |
          $pyiArgs = @(
            '--noconfirm',
            '--clean',
            '--windowed',
            '--onedir',
            '--name', 'ARARA-Factory',
            '--paths', 'src',
            '--hidden-import', 'arara_factory.entry',
            '--hidden-import', 'arara_factory.batch_worker',
            '--hidden-import', 'arara_factory.integrated_batch',
            '--hidden-import', 'arara_factory.oauth_local',
            '--hidden-import', 'arara_factory.process_utils',
            '--hidden-import', 'arara_factory.publishing',
            '--hidden-import', 'arara_factory.publishing_library',
            '--hidden-import', 'arara_factory.publishing_library_ui',
            '--hidden-import', 'arara_factory.publishing_ui',
            '--hidden-import', 'arara_factory.publishing_oauth_ui',
            '--hidden-import', 'arara_factory.publishing_runtime_ui',
            '--hidden-import', 'arara_factory.secure_store',
            '--hidden-import', 'arara_factory.smart_ui',
            '--hidden-import', 'arara_factory.social_oauth',
            '--hidden-import', 'google.auth.transport.requests',
            '--hidden-import', 'google.oauth2.credentials',
            '--hidden-import', 'googleapiclient.discovery',
            '--hidden-import', 'googleapiclient.errors',
            '--hidden-import', 'googleapiclient.http',
            '--hidden-import', 'google_auth_oauthlib.flow',
            '--collect-all', 'googleapiclient',
            '--collect-all', 'google_auth_oauthlib',
            '--hidden-import', 'PySide6.QtMultimedia',
            '--hidden-import', 'PySide6.QtMultimediaWidgets',
            '--add-binary', 'ffmpeg.exe;.',
            '--add-binary', 'ffprobe.exe;.',
            'launcher.py'
          )
          python -m PyInstaller @pyiArgs
          if (-not (Test-Path 'dist\ARARA-Factory\ARARA-Factory.exe')) {
            throw 'ARARA Factory application directory was not created'
          }

      - name: Install Inno Setup
        shell: powershell
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler not found' }

      - name: Build installer
        shell: powershell
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler 'installer\arara_factory.iss'
          if (-not (Test-Path 'installer-output\ARARA-Factory-Setup.exe')) {
            throw 'Installer was not created'
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: ARARA-Factory-Installer
          path: installer-output/ARARA-Factory-Setup.exe
          if-no-files-found: error

      - name: Upload portable application folder
        uses: actions/upload-artifact@v6
        with:
          name: ARARA-Factory-Portable
          path: dist/ARARA-Factory/**
          if-no-files-found: error

      - name: Publish permanent update release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $tag = "v$version"
          $asset = 'installer-output/ARARA-Factory-Setup.exe'
          $repo = $env:GITHUB_REPOSITORY

          $releaseListJson = gh release list --repo $repo --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub Releases' }
          $releaseList = $releaseListJson | ConvertFrom-Json
          $exists = @($releaseList | Where-Object { $_.tagName -eq $tag }).Count -gt 0

          if ($exists) {
            gh release upload $tag $asset --repo $repo --clobber
          } else {
            gh release create $tag $asset --repo $repo --target $env:GITHUB_SHA --title "ARARA Factory $version" --notes "Guided UI redesign: Create Reels and Publish now use four clear steps each. Readable fixed-size actions, scene review, batch summary, folder/file publishing, exact first/last scheduled post preview, shared progress, OAuth and persistent no-duplicate queue."
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release was not published' }

          $releaseJson = gh release view $tag --repo $repo --json assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify GitHub Release' }
          $release = $releaseJson | ConvertFrom-Json
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          if ($assetNames -notcontains 'ARARA-Factory-Setup.exe') {
            throw 'Release exists, but installer asset is missing'
          }
          Write-Host "Published $tag with ARARA-Factory-Setup.exe"
