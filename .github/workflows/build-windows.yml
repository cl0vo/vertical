name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'installer/**'
      - 'launcher.py'
      - 'pyproject.toml'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pytest

      - name: Validate application
        run: |
          python -m compileall -q src launcher.py
          python -c "import vosk; import arara_factory.app; import arara_factory.render; import arara_factory.transcribe; print('ARARA imports OK')"
          pytest -q

      - name: Download FFmpeg
        shell: powershell
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $probe = Get-ChildItem ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $bin -or -not $probe) { throw 'FFmpeg download is incomplete' }
          Copy-Item $bin.FullName ffmpeg.exe
          Copy-Item $probe.FullName ffprobe.exe

      - name: Download offline Russian subtitle model
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Invoke-WebRequest https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -OutFile vosk-model.zip
          Expand-Archive vosk-model.zip -DestinationPath assets
          if (-not (Test-Path 'assets\vosk-model-small-ru-0.22\am')) {
            throw 'Russian Vosk model was not downloaded correctly'
          }

      - name: Build portable application
        shell: powershell
        run: |
          $pyiArgs = @(
            '--noconfirm',
            '--clean',
            '--windowed',
            '--onefile',
            '--name', 'ARARA-Factory',
            '--paths', 'src',
            '--collect-all', 'vosk',
            '--add-binary', 'ffmpeg.exe;.',
            '--add-binary', 'ffprobe.exe;.',
            '--add-data', 'assets\vosk-model-small-ru-0.22;assets\vosk-model-small-ru-0.22',
            'launcher.py'
          )
          python -m PyInstaller @pyiArgs

      - name: Install Inno Setup
        shell: powershell
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler not found' }

      - name: Build installer
        shell: powershell
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler 'installer\arara_factory.iss'
          if (-not (Test-Path 'installer-output\ARARA-Factory-Setup.exe')) {
            throw 'Installer was not created'
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: ARARA-Factory-Installer
          path: installer-output/ARARA-Factory-Setup.exe
          if-no-files-found: error

      - name: Upload portable version
        uses: actions/upload-artifact@v6
        with:
          name: ARARA-Factory-Portable
          path: dist/ARARA-Factory.exe
          if-no-files-found: error
