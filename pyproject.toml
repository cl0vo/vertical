[project]
name = "arara-factory"
version = "0.1.0"
description = "Local ARARA reels assembly pipeline"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.scripts]
arara-factory = "arara_factory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
