name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'installer/**'
      - 'launcher.py'
      - 'pyproject.toml'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: arara-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pytest

      - name: Validate application
        run: |
          python -m compileall -q src launcher.py
          python -c "import vosk; import PySide6.QtMultimedia; import PySide6.QtMultimediaWidgets; import arara_factory.app; import arara_factory.preview; import arara_factory.updater; print('ARARA imports OK')"
          pytest -q

      - name: Download FFmpeg
        shell: powershell
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $probe = Get-ChildItem ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $bin -or -not $probe) { throw 'FFmpeg download is incomplete' }
          Copy-Item $bin.FullName ffmpeg.exe
          Copy-Item $probe.FullName ffprobe.exe

      - name: Smoke-test real FFmpeg render
        shell: powershell
        run: |
          .\ffmpeg.exe -y -hide_banner -loglevel error -f lavfi -i "color=c=blue:s=270x480:r=30" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 9 -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac smoke-reel.mp4
          .\ffmpeg.exe -y -hide_banner -loglevel error -f lavfi -i "testsrc2=s=320x180:r=30" -t 20 -c:v libx264 -preset ultrafast -pix_fmt yuv420p smoke-brainrot.mp4
          @'
          from pathlib import Path
          from arara_factory.render import RenderOptions, _binary, probe_media, render_reels

          output = Path('smoke-output')
          made = render_reels(
              Path('smoke-reel.mp4'),
              Path('smoke-brainrot.mp4'),
              output,
              RenderOptions(
                  subtitles_enabled=False,
                  encoder_mode='cpu',
                  encoder_preset='ultrafast',
                  crf=28,
              ),
              log=print,
          )
          assert len(made) == 1 and made[0].is_file(), made
          ffprobe = _binary('ffprobe')
          assert ffprobe
          duration = probe_media(ffprobe, made[0]).duration
          assert 8.85 <= duration <= 9.15, duration
          print(f'ARARA smoke render OK: {made[0]} ({duration:.3f}s)')
          '@ | python -

      - name: Download offline Russian subtitle model
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Invoke-WebRequest https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -OutFile vosk-model.zip
          Expand-Archive vosk-model.zip -DestinationPath assets
          if (-not (Test-Path 'assets\vosk-model-small-ru-0.22\am')) {
            throw 'Russian Vosk model was not downloaded correctly'
          }
          python -c "from arara_factory.transcribe import model_path; print('Subtitle model:', model_path())"

      - name: Build installed application directory
        shell: powershell
        run: |
          $pyiArgs = @(
            '--noconfirm',
            '--clean',
            '--windowed',
            '--onedir',
            '--name', 'ARARA-Factory',
            '--paths', 'src',
            '--collect-all', 'vosk',
            '--hidden-import', 'PySide6.QtMultimedia',
            '--hidden-import', 'PySide6.QtMultimediaWidgets',
            '--add-binary', 'ffmpeg.exe;.',
            '--add-binary', 'ffprobe.exe;.',
            '--add-data', 'assets\vosk-model-small-ru-0.22;assets\vosk-model-small-ru-0.22',
            'launcher.py'
          )
          python -m PyInstaller @pyiArgs
          if (-not (Test-Path 'dist\ARARA-Factory\ARARA-Factory.exe')) {
            throw 'ARARA Factory application directory was not created'
          }

      - name: Install Inno Setup
        shell: powershell
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler not found' }

      - name: Build installer
        shell: powershell
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler 'installer\arara_factory.iss'
          if (-not (Test-Path 'installer-output\ARARA-Factory-Setup.exe')) {
            throw 'Installer was not created'
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: ARARA-Factory-Installer
          path: installer-output/ARARA-Factory-Setup.exe
          if-no-files-found: error

      - name: Upload portable application folder
        uses: actions/upload-artifact@v6
        with:
          name: ARARA-Factory-Portable
          path: dist/ARARA-Factory/**
          if-no-files-found: error

      - name: Publish permanent update release
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $tag = "v$version"
          $asset = 'installer-output\ARARA-Factory-Setup.exe'
          $repo = $env:GITHUB_REPOSITORY

          $releaseList = gh release list --repo $repo --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub Releases' }
          $exists = @($releaseList | Where-Object { $_.tagName -eq $tag }).Count -gt 0

          if ($exists) {
            gh release upload $tag $asset --repo $repo --clobber
          } else {
            gh release create $tag $asset --repo $repo --target $env:GITHUB_SHA --title "ARARA Factory $version" --notes "Двухпанельный интерфейс с встроенным 9:16-предпросмотром, компактными кнопками и обновлением поверх установленной версии."
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release was not published' }

          $release = gh release view $tag --repo $repo --json assets | ConvertFrom-Json
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          if ($assetNames -notcontains 'ARARA-Factory-Setup.exe') {
            throw 'Release exists, but installer asset is missing'
          }
          Write-Host "Published $tag with ARARA-Factory-Setup.exe"
