name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Download FFmpeg
        shell: powershell
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $bin = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName ffmpeg.exe
          $probe = Get-ChildItem ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $probe.FullName ffprobe.exe
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --windowed --onefile --name "ARARA-Factory" --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." src/arara_factory/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ARARA-Factory-Windows
          path: dist/ARARA-Factory.exe
