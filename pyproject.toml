[project]
name = "arara-factory"
version = "0.9.0"
description = "Personal Windows app that adds zoomed brainrot and offline Russian subtitles to ARARA Reels"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.4",
  "pydantic>=2.7",
  "PySide6>=6.7",
  "typer>=0.12",
  "pyyaml>=6.0",
  "vosk==0.3.45",
]

[project.scripts]
arara-factory = "arara_factory.cli:app"
arara-factory-gui = "arara_factory.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
