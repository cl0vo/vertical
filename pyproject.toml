[project]
name = "arara-factory"
version = "0.14.0"
description = "One-window ARARA workflow with safe resumable batches and simple three-step creation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.4",
  "pydantic>=2.7",
  "PySide6>=6.7",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.scripts]
arara-factory = "arara_factory.entry:main"
arara-factory-gui = "arara_factory.entry:main"
arara-factory-batch = "arara_factory.entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
