[project]
name = "arara-factory"
version = "0.10.2"
description = "Personal Windows app with embedded preview, zoomed brainrot, ARARA pulse-timed subtitles and one-click updates"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.4",
  "pydantic>=2.7",
  "PySide6>=6.7",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.scripts]
arara-factory = "arara_factory.cli:app"
arara-factory-gui = "arara_factory.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
