[project]
name = "arara-factory"
version = "0.13.1"
description = "Personal Windows app with silent background FFmpeg jobs and live batch progress"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.4",
  "pydantic>=2.7",
  "PySide6>=6.7",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.scripts]
arara-factory = "arara_factory.cli:app"
arara-factory-gui = "arara_factory.app:main"
arara-factory-batch = "arara_factory.batch_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
